name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            goarch: amd64
            asset_name: FishTun-${{ github.ref_name }}-linux-amd64.tar.gz
            ext: tar.gz
          - os: windows-latest
            goarch: amd64
            asset_name: FishTun-${{ github.ref_name }}-windows-amd64.exe
            ext: exe
          - os: windows-latest
            goarch: arm64
            asset_name: FishTun-${{ github.ref_name }}-windows-arm64.exe
            ext: exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc libx11-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev libxxf86vm-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev


      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest


      - name: Build (Unix)
        if: runner.os == 'Linux'
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -tags webkit2_41

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          wails build -tags webkit2_41

      - name: Package Linux
        if: matrix.ext == 'tar.gz'
        run: tar -czf "${{ matrix.asset_name }}" -C build/bin FishTun

      - name: Package Windows
        if: matrix.ext == 'exe'
        run: |
          mv build/bin/FishTun.exe "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FishTun-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: FishTun-*
          generate_release_notes: true
