name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goarch: amd64
            platform: linux/amd64
            asset_name: FishTun-${{ github.ref_name }}-linux-amd64.tar.gz
            ext: tar.gz
          - os: ubuntu-24.04
            goarch: arm64
            platform: linux/arm64
            asset_name: FishTun-${{ github.ref_name }}-linux-arm64.tar.gz
            ext: tar.gz
          - os: macos-15
            goarch: universal
            platform: darwin/universal
            asset_name: FishTun-${{ github.ref_name }}-darwin-universal.dmg
            ext: dmg
          - os: windows-latest
            goarch: amd64
            platform: windows/amd64
            asset_name: FishTun-${{ github.ref_name }}-windows-amd64.exe
            ext: exe
          - os: windows-latest
            goarch: arm64
            platform: windows/arm64
            asset_name: FishTun-${{ github.ref_name }}-windows-arm64.exe
            ext: exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc libx11-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev libxxf86vm-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # linux/arm64 needs native aarch64 GTK/WebKit dev packages, which are not
      # available on the x86_64 runner. Build it inside an emulated arm64
      # container instead of cross-compiling cgo.
      - name: Prepare frontend for arm64 (host)
        if: matrix.platform == 'linux/arm64'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # wails generate module compiles the package, so the //go:embed
          # all:frontend/dist target must exist before bindings are generated.
          mkdir -p frontend/dist && touch frontend/dist/gitkeep
          wails generate module -tags webkit2_41
          npm --prefix frontend run build

      - name: Build (linux/arm64 via QEMU container)
        if: matrix.platform == 'linux/arm64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ubuntu:24.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
              curl -fsSL https://go.dev/dl/go1.25.0.linux-arm64.tar.gz -o /tmp/go.tgz
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH="/usr/local/go/bin:/root/go/bin:$PATH"
              git config --global --add safe.directory /src
              go install github.com/wailsapp/wails/v2/cmd/wails@latest
              wails build -platform linux/arm64 -s -tags webkit2_41
            '

      - name: Build
        if: matrix.platform != 'linux/arm64'
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Package Linux
        if: matrix.ext == 'tar.gz'
        run: tar -czf "${{ matrix.asset_name }}" -C build/bin FishTun

      - name: Package macOS
        if: matrix.ext == 'dmg'
        run: |
          rm -f "${{ matrix.asset_name }}"
          hdiutil create -srcfolder build/bin/FishTun.app \
            -volname FishTun \
            -fs HFS+ \
            -format UDZO \
            "${{ matrix.asset_name }}"

      - name: Package Windows
        if: matrix.ext == 'exe'
        shell: bash
        run: |
          mv build/bin/FishTun.exe "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FishTun-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: FishTun-*
          generate_release_notes: true
